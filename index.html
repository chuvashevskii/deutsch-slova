<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Deutsch für jeden Tag</title>
    <meta
      name="description"
      content="Немецкие слова по частотности: разбор форм, озвучка, интервальные повторения."
    />

    <!--
      Установка на домашний экран. Приложение открывают с телефона по
      нескольку раз в день, и без манифеста оно каждый раз начинается
      с адресной строки, а браузерная обвязка сверху и снизу отъедает
      экран у карточки.

      theme-color совпадает с фоном страницы, иначе полоса статуса
      остаётся чужого цвета и стык видно.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F3F2EC" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Deutsch" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Шрифт для транскрипции лежит локально: Google отдаёт Charis SIL
      подмножествами, и в них нет U+032F — крючка под неслоговой гласной
      в li̯, aɪ̯, ɐ̯. Он встречается у 608 слов из 2000.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
