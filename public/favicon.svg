<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Три полосы — три рода: der синий, die малиновый, das зелёный.
       Те же цвета красят каждое существительное в списке и на обороте
       карточки, так что знак говорит на языке самого приложения. -->
  <rect width="512" height="512" fill="#F3F2EC"/>
  <rect x="112" y="128" width="288" height="66" rx="33" fill="#1775D3"/>
  <rect x="112" y="223" width="288" height="66" rx="33" fill="#D83B6A"/>
  <rect x="112" y="318" width="288" height="66" rx="33" fill="#1F9D53"/>
</svg>
